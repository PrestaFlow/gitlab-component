name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  mirror-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to gitlab.com/prestaflow/ci
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: prestaflow/ci
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::GITLAB_TOKEN secret not set. Create a personal or project access token on gitlab.com with 'api,write_repository' scopes and add it as GITLAB_TOKEN in this repo's secrets."
            exit 1
          fi
          git config user.name "PrestaFlow Release Bot"
          git config user.email "noreply@prestaflow.io"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git"
          git push gitlab --mirror

      - name: Note next steps
        run: |
          echo "::notice::Component pushed to gitlab.com/${GITLAB_PROJECT}. Ensure the CI/CD Catalog page for this project is published: https://gitlab.com/${GITLAB_PROJECT}/-/settings/general → Visibility → Catalog resource."
