name: Release

on:
  push:
    tags:
      - 'v*'

# Consumers include templates/prestaflow.yml straight from GitHub at the tag
# (include: remote), so a release is just the tag: nothing is mirrored or
# uploaded. This only checks that the template clones its own scripts.
permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Template component_ref matches the tag
        run: |
          set -euo pipefail
          ref=$(awk '/^    component_ref:/{f=1} f && /default:/{gsub(/[" ]/,"",$2); print $2; exit}' templates/prestaflow.yml)
          if [ "$ref" != "$GITHUB_REF_NAME" ]; then
            echo "::error::templates/prestaflow.yml has component_ref default '${ref}', expected '${GITHUB_REF_NAME}'. The template would clone other scripts than its own."
            exit 1
          fi
          echo "::notice::Include with: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/templates/prestaflow.yml"
